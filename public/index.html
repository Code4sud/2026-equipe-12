<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Potentiel caché</title>
  <link rel="icon" href="illustrations/logo.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --fond: #fbf7f2; --texte: #1d1b19; --accent: #c8743a; }
    @media (prefers-color-scheme: dark) { :root { --fond: #18171a; --texte: #f2eee9; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fond); color: var(--texte);
      font: 18px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
    img { width: 96px; height: 96px; }
    h1 { margin: 0.4em 0 0.2em; }
    p { max-width: 36em; margin: 0 auto; }
    strong { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <img src="illustrations/logo.svg" alt="">
    <h1>Potentiel caché</h1>
    <p>Le jeu de rôle des compétences : chacun joue son propre rôle, un MJ IA révèle les compétences que tu as déjà. <strong>En construction.</strong></p>
  </main>
</body>
</html>
