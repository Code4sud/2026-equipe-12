<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ev-titre ev-desc">
  <title id="ev-titre">Un mercredi après-midi pluvieux avec deux enfants</title>
  <desc id="ev-desc">Une table près d'une fenêtre où il pleut. Sur la table : deux manettes de console, un cahier de maths ouvert, un dessin avec des crayons de couleur et un sablier.</desc>
  <!-- Mur et sol -->
  <rect width="800" height="500" fill="#faf7f2"/>
  <rect width="800" height="350" fill="#e8eef6"/>
  <rect y="350" width="800" height="150" fill="#f1e4d0"/>
  <!-- Fenêtre avec la pluie -->
  <rect x="70" y="50" width="250" height="210" rx="8" fill="#ffffff"/>
  <rect x="84" y="64" width="222" height="182" rx="4" fill="#9fb8cf"/>
  <g fill="#7f97ad">
    <ellipse cx="150" cy="96" rx="48" ry="18"/>
    <ellipse cx="184" cy="86" rx="34" ry="20"/>
    <ellipse cx="250" cy="112" rx="40" ry="15"/>
  </g>
  <g stroke="#e8f1f8" stroke-width="3" stroke-linecap="round">
    <line x1="110" y1="130" x2="102" y2="150"/>
    <line x1="150" y1="150" x2="142" y2="170"/>
    <line x1="196" y1="128" x2="188" y2="148"/>
    <line x1="236" y1="160" x2="228" y2="180"/>
    <line x1="276" y1="136" x2="268" y2="156"/>
    <line x1="126" y1="196" x2="118" y2="216"/>
    <line x1="170" y1="210" x2="162" y2="230"/>
    <line x1="214" y1="190" x2="206" y2="210"/>
    <line x1="258" y1="214" x2="250" y2="234"/>
  </g>
  <rect x="192" y="64" width="6" height="182" fill="#ffffff"/>
  <rect x="84" y="152" width="222" height="6" fill="#ffffff"/>
  <rect x="60" y="256" width="270" height="12" rx="4" fill="#d9d2c4"/>
  <!-- Horloge : 14 h -->
  <circle cx="640" cy="110" r="46" fill="#ffffff" stroke="#3b3f58" stroke-width="5"/>
  <g stroke="#3b3f58" stroke-width="4" stroke-linecap="round">
    <line x1="640" y1="110" x2="640" y2="78"/>
    <line x1="640" y1="110" x2="664" y2="122"/>
  </g>
  <circle cx="640" cy="110" r="4" fill="#e2572b"/>
  <!-- Table -->
  <ellipse cx="420" cy="472" rx="320" ry="14" fill="#3b3f58" opacity="0.12"/>
  <rect x="150" y="340" width="16" height="132" rx="5" fill="#b97a45"/>
  <rect x="674" y="340" width="16" height="132" rx="5" fill="#b97a45"/>
  <rect x="110" y="318" width="620" height="28" rx="8" fill="#d79a62"/>
  <rect x="110" y="338" width="620" height="10" fill="#b97a45" opacity="0.5"/>
  <!-- Cahier de maths ouvert -->
  <g transform="rotate(-4 300 270)">
    <rect x="200" y="214" width="200" height="104" rx="4" fill="#ffffff"/>
    <rect x="298" y="214" width="4" height="104" fill="#d9d2c4"/>
    <g stroke="#bcd3ea" stroke-width="2">
      <line x1="210" y1="236" x2="292" y2="236"/>
      <line x1="210" y1="256" x2="292" y2="256"/>
      <line x1="210" y1="276" x2="292" y2="276"/>
      <line x1="210" y1="296" x2="292" y2="296"/>
      <line x1="308" y1="236" x2="390" y2="236"/>
      <line x1="308" y1="256" x2="390" y2="256"/>
      <line x1="308" y1="276" x2="390" y2="276"/>
      <line x1="308" y1="296" x2="390" y2="296"/>
    </g>
    <text x="214" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#3b3f58">7 × 8 =</text>
    <text x="214" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#3b3f58">36 + 9 =</text>
    <text x="312" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#e2572b">?</text>
  </g>
  <!-- Crayon à papier -->
  <g transform="rotate(20 420 300)">
    <rect x="380" y="294" width="78" height="11" rx="3" fill="#f2c14e"/>
    <path d="M458 294 l14 5.5 l-14 5.5 z" fill="#f1e4d0"/>
    <path d="M467 297.5 l5 2 l-5 2 z" fill="#3b3f58"/>
    <rect x="374" y="294" width="8" height="11" rx="2" fill="#e88aa0"/>
  </g>
  <!-- Deux manettes de console -->
  <g transform="rotate(-10 520 292)">
    <path d="M478 276 q-18 0 -22 22 q-4 22 12 24 q10 1 18 -10 h40 q8 11 18 10 q16 -2 12 -24 q-4 -22 -22 -22 z" fill="#3b3f58"/>
    <circle cx="482" cy="294" r="6" fill="#6fb38a"/>
    <circle cx="532" cy="290" r="4" fill="#e2572b"/>
    <circle cx="542" cy="298" r="4" fill="#f2c14e"/>
  </g>
  <g transform="rotate(14 600 300)">
    <path d="M566 284 q-18 0 -22 22 q-4 22 12 24 q10 1 18 -10 h40 q8 11 18 10 q16 -2 12 -24 q-4 -22 -22 -22 z" fill="#4a8fbf"/>
    <circle cx="570" cy="302" r="6" fill="#ffffff"/>
    <circle cx="620" cy="298" r="4" fill="#e2572b"/>
    <circle cx="630" cy="306" r="4" fill="#f2c14e"/>
  </g>
  <!-- Sablier (tour de rôle) -->
  <g>
    <rect x="652" y="226" width="44" height="8" rx="3" fill="#b97a45"/>
    <rect x="652" y="310" width="44" height="8" rx="3" fill="#b97a45"/>
    <path d="M658 234 h32 q0 26 -14 38 q14 12 14 38 h-32 q0 -26 14 -38 q-14 -12 -14 -38 z" fill="#ffffff" stroke="#9aa0b4" stroke-width="2"/>
    <path d="M664 246 h20 q-2 14 -10 22 q-8 -8 -10 -22 z" fill="#f2c14e"/>
    <path d="M662 308 q12 -18 24 0 z" fill="#f2c14e"/>
  </g>
  <!-- Dessin et crayons de couleur -->
  <g transform="rotate(6 150 280)">
    <rect x="118" y="236" width="74" height="80" rx="3" fill="#ffffff"/>
    <circle cx="140" cy="258" r="10" fill="#f2c14e"/>
    <path d="M126 304 l22 -26 l16 16 l12 -12 l14 22 z" fill="#6fb38a"/>
  </g>
  <g>
    <rect x="96" y="320" width="54" height="7" rx="3" fill="#e2572b" transform="rotate(-12 120 322)"/>
    <rect x="110" y="330" width="54" height="7" rx="3" fill="#4a8fbf" transform="rotate(8 136 332)"/>
  </g>
</svg>
