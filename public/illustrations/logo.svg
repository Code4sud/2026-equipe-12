    <path d="M440 300 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 z" fill="#f2c14e"/>
    <path d="M128 98 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 z" fill="#faf7f2"/>
    <circle cx="352" cy="140" r="6" fill="#faf7f2"/>
