<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="sp-titre sp-desc">
  <title id="sp-titre">Scooter en panne au bord de la mer</title>
  <desc id="sp-desc">Un scooter est arrêté au bord d'une route qui longe la mer. Par terre, une clé à molette et un smartphone qui affiche un tutoriel vidéo.</desc>
  <!-- Ciel -->
  <rect width="800" height="500" fill="#faf7f2"/>
  <rect width="800" height="190" fill="#dcecf2"/>
  <circle cx="640" cy="78" r="40" fill="#f2c14e"/>
  <g fill="#ffffff">
    <ellipse cx="300" cy="60" rx="56" ry="17"/>
    <ellipse cx="330" cy="48" rx="34" ry="20"/>
  </g>
  <!-- Mer -->
  <rect y="170" width="800" height="110" fill="#6fa9d1"/>
  <rect y="170" width="800" height="12" fill="#8cc0e0"/>
  <g fill="none" stroke="#cfe6f0" stroke-width="4" stroke-linecap="round">
    <path d="M60 210 q15 -8 30 0 q15 8 30 0"/>
    <path d="M420 200 q15 -8 30 0 q15 8 30 0"/>
    <path d="M560 236 q15 -8 30 0 q15 8 30 0"/>
    <path d="M250 246 q15 -8 30 0 q15 8 30 0"/>
  </g>
  <!-- Voilier -->
  <path d="M520 168 h70 l-10 14 h-50 z" fill="#3b3f58"/>
  <path d="M552 164 v-64 l34 60 z" fill="#ffffff"/>
  <path d="M548 164 v-50 l-26 46 z" fill="#e2572b"/>
  <!-- Rambarde de la promenade -->
  <rect y="240" width="800" height="9" fill="#4a8fbf"/>
  <g fill="#4a8fbf">
    <rect x="20" y="249" width="7" height="42"/>
    <rect x="90" y="249" width="7" height="42"/>
    <rect x="160" y="249" width="7" height="42"/>
    <rect x="230" y="249" width="7" height="42"/>
    <rect x="300" y="249" width="7" height="42"/>
    <rect x="370" y="249" width="7" height="42"/>
    <rect x="440" y="249" width="7" height="42"/>
    <rect x="510" y="249" width="7" height="42"/>
    <rect x="580" y="249" width="7" height="42"/>
    <rect x="650" y="249" width="7" height="42"/>
    <rect x="720" y="249" width="7" height="42"/>
    <rect x="790" y="249" width="7" height="42"/>
  </g>
  <rect y="266" width="800" height="5" fill="#4a8fbf"/>
  <!-- Route -->
  <rect y="290" width="800" height="84" fill="#9a9fb2"/>
  <g fill="#faf7f2">
    <rect x="10" y="328" width="60" height="7" rx="3.5"/>
    <rect x="150" y="328" width="60" height="7" rx="3.5"/>
    <rect x="290" y="328" width="60" height="7" rx="3.5"/>
    <rect x="430" y="328" width="60" height="7" rx="3.5"/>
    <rect x="570" y="328" width="60" height="7" rx="3.5"/>
    <rect x="710" y="328" width="60" height="7" rx="3.5"/>
  </g>
  <!-- Trottoir -->
  <rect y="374" width="800" height="126" fill="#f1e4d0"/>
  <rect y="370" width="800" height="8" fill="#e3d2b8"/>
  <!-- Palmier -->
  <path d="M96 470 q-8 -120 14 -260" fill="none" stroke="#b97a45" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="96" cy="472" rx="30" ry="7" fill="#3b3f58" opacity="0.12"/>
  <g fill="#6fb38a">
    <path d="M110 210 q-60 -30 -96 10 q50 -12 96 -10 z"/>
    <path d="M110 210 q-40 -60 -90 -50 q50 10 90 50 z"/>
    <path d="M110 210 q20 -66 80 -62 q-50 16 -80 62 z"/>
    <path d="M110 210 q66 -20 100 22 q-54 -20 -100 -22 z"/>
    <path d="M110 210 q40 20 46 70 q-24 -44 -46 -70 z"/>
    <path d="M110 210 q-40 16 -56 64 q26 -40 56 -64 z"/>
  </g>
  <!-- Ombre du scooter -->
  <ellipse cx="510" cy="442" rx="150" ry="10" fill="#3b3f58" opacity="0.15"/>
  <!-- Roues -->
  <circle cx="420" cy="405" r="34" fill="#3b3f58"/>
  <circle cx="420" cy="405" r="15" fill="#c9cdd8"/>
  <circle cx="580" cy="405" r="34" fill="#3b3f58"/>
  <circle cx="580" cy="405" r="15" fill="#c9cdd8"/>
  <!-- Béquille -->
  <line x1="540" y1="388" x2="526" y2="440" stroke="#3b3f58" stroke-width="7" stroke-linecap="round"/>
  <!-- Fourche et garde-boue avant -->
  <line x1="462" y1="276" x2="420" y2="405" stroke="#3b3f58" stroke-width="9" stroke-linecap="round"/>
  <path d="M384 402 q36 -54 72 0" fill="none" stroke="#e2572b" stroke-width="11" stroke-linecap="round"/>
  <!-- Carrosserie -->
  <path d="M500 388 L622 388 Q652 388 647 356 Q637 314 582 314 L522 314 Q500 314 496 346 Z" fill="#e2572b"/>
  <rect x="450" y="376" width="64" height="14" rx="4" fill="#c84a22"/>
  <path d="M440 390 L460 266 L486 270 L470 390 Z" fill="#e2572b"/>
  <!-- Trappe moteur ouverte -->
  <path d="M560 346 h50 v32 h-50 z" fill="#3b3f58"/>
  <path d="M560 346 l-14 -22 h48 l16 22 z" fill="#f08a5d"/>
  <circle cx="584" cy="362" r="7" fill="#9aa0b4"/>
  <!-- Selle, guidon, phare, rétroviseur -->
  <rect x="520" y="298" width="106" height="20" rx="10" fill="#3b3f58"/>
  <line x1="470" y1="270" x2="472" y2="250" stroke="#3b3f58" stroke-width="7" stroke-linecap="round"/>
  <line x1="448" y1="252" x2="496" y2="246" stroke="#3b3f58" stroke-width="8" stroke-linecap="round"/>
  <line x1="490" y1="246" x2="500" y2="228" stroke="#3b3f58" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="502" cy="224" rx="9" ry="6" fill="#9aa0b4"/>
  <circle cx="454" cy="276" r="11" fill="#f2c14e"/>
  <!-- Fumée -->
  <g fill="#c9cdd8">
    <circle cx="664" cy="330" r="14" opacity="0.9"/>
    <circle cx="684" cy="302" r="19" opacity="0.8"/>
    <circle cx="710" cy="268" r="24" opacity="0.65"/>
  </g>
  <!-- Triangle de signalisation -->
  <path d="M720 382 l34 60 h-68 z" fill="none" stroke="#e2572b" stroke-width="9" stroke-linejoin="round"/>
  <rect x="716" y="404" width="8" height="20" rx="4" fill="#3b3f58"/>
  <circle cx="720" cy="432" r="4" fill="#3b3f58"/>
  <!-- Clé à molette -->
  <g transform="rotate(-14 360 462)">
    <rect x="330" y="456" width="78" height="12" rx="6" fill="#7c8299"/>
    <circle cx="324" cy="462" r="17" fill="#7c8299"/>
    <rect x="300" y="456" width="22" height="12" fill="#f1e4d0"/>
    <rect x="345" y="459" width="30" height="5" rx="2.5" fill="#9aa0b4"/>
  </g>
  <!-- Smartphone avec tutoriel vidéo -->
  <ellipse cx="240" cy="452" rx="74" ry="7" fill="#3b3f58" opacity="0.15"/>
  <path d="M206 428 l-14 20 h96 l-14 -20 z" fill="#9aa0b4"/>
  <rect x="150" y="318" width="180" height="112" rx="14" fill="#3b3f58"/>
  <rect x="161" y="328" width="158" height="92" rx="6" fill="#2f4a6b"/>
  <!-- Mini scooter dans la vidéo -->
  <g opacity="0.55">
    <circle cx="196" cy="390" r="8" fill="#cfe6f0"/>
    <circle cx="232" cy="390" r="8" fill="#cfe6f0"/>
    <path d="M204 386 h26 q8 0 6 -10 q-2 -8 -12 -8 h-14 q-6 0 -6 8 z" fill="#cfe6f0"/>
    <path d="M190 388 l6 -30 h6 l-4 30 z" fill="#cfe6f0"/>
  </g>
  <!-- Mini clé dans la vidéo -->
  <g transform="rotate(30 290 352)" fill="#f2c14e">
    <rect x="276" y="348" width="30" height="7" rx="3.5"/>
    <circle cx="274" cy="351.5" r="8"/>
  </g>
  <rect x="262" y="347" width="8" height="5" fill="#2f4a6b" transform="rotate(30 290 352)"/>
  <!-- Bouton lecture -->
  <circle cx="240" cy="366" r="21" fill="#ffffff" opacity="0.92"/>
  <path d="M233 354 l20 12 l-20 12 z" fill="#e2572b"/>
  <!-- Barre de progression -->
  <rect x="172" y="404" width="136" height="5" rx="2.5" fill="#4a6a8d"/>
  <rect x="172" y="404" width="54" height="5" rx="2.5" fill="#e2572b"/>
  <circle cx="226" cy="406.5" r="6" fill="#ffffff"/>
</svg>
