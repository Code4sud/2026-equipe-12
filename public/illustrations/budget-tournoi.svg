<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="an-titre an-desc">
  <title id="an-titre">Le budget du tournoi</title>
  <desc id="an-desc">Une table décorée de ballons, avec un petit gâteau, un billet de 150 euros et une liste de courses à cocher.</desc>
  <!-- Mur et sol -->
  <rect width="800" height="500" fill="#faf7f2"/>
  <rect width="800" height="360" fill="#fbe9dc"/>
  <rect y="360" width="800" height="140" fill="#f1e4d0"/>
  <!-- Guirlande de fanions -->
  <path d="M0 40 Q400 120 800 40" fill="none" stroke="#3b3f58" stroke-width="3"/>
  <g>
    <path d="M40 52 l36 10 l-24 30 z" fill="#e2572b"/>
    <path d="M120 72 l38 8 l-22 32 z" fill="#f2c14e"/>
    <path d="M204 88 l38 5 l-18 34 z" fill="#6fb38a"/>
    <path d="M290 96 l38 2 l-16 35 z" fill="#4a8fbf"/>
    <path d="M378 100 l38 0 l-19 36 z" fill="#e2572b"/>
    <path d="M466 98 l38 -2 l-22 34 z" fill="#f2c14e"/>
    <path d="M554 90 l38 -5 l-20 34 z" fill="#6fb38a"/>
    <path d="M640 76 l38 -8 l-14 34 z" fill="#4a8fbf"/>
    <path d="M722 58 l36 -10 l-12 34 z" fill="#e2572b"/>
  </g>
  <!-- Ballons gauche -->
