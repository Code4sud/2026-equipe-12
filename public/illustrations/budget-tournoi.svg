  <ellipse cx="110" cy="200" rx="40" ry="48" fill="#e2572b"/>
  <path d="M104 246 l12 0 l-6 10 z" fill="#e2572b"/>
  <ellipse cx="96" cy="182" rx="9" ry="14" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="170" cy="168" rx="36" ry="44" fill="#4a8fbf"/>
  <path d="M164 210 l12 0 l-6 10 z" fill="#4a8fbf"/>
  <ellipse cx="158" cy="152" rx="8" ry="13" fill="#ffffff" opacity="0.45"/>
  <!-- Ballon droite -->
  <ellipse cx="690" cy="186" rx="42" ry="50" fill="#6fb38a"/>
  <path d="M684 234 l12 0 l-6 10 z" fill="#6fb38a"/>
  <ellipse cx="676" cy="168" rx="9" ry="14" fill="#ffffff" opacity="0.45"/>
  <!-- Table -->
  <ellipse cx="400" cy="470" rx="300" ry="14" fill="#3b3f58" opacity="0.12"/>
  <rect x="160" y="330" width="16" height="140" rx="5" fill="#b97a45"/>
  <rect x="624" y="330" width="16" height="140" rx="5" fill="#b97a45"/>
  <rect x="120" y="310" width="560" height="28" rx="8" fill="#d79a62"/>
  <rect x="120" y="330" width="560" height="10" fill="#b97a45" opacity="0.5"/>
  <!-- Nappe festive -->
  <path d="M150 338 h500 v22 q-25 18 -50 0 q-25 18 -50 0 q-25 18 -50 0 q-25 18 -50 0 q-25 18 -50 0 q-25 18 -50 0 q-25 18 -50 0 q-25 18 -50 0 q-25 18 -50 0 q-25 18 -50 0 z" fill="#ffffff" opacity="0.85"/>
  <!-- Gâteau -->
  <ellipse cx="300" cy="308" rx="76" ry="10" fill="#ffffff"/>
  <rect x="244" y="252" width="112" height="54" rx="10" fill="#f08a5d"/>
  <path d="M244 264 q0 -12 12 -12 h88 q12 0 12 12 v6 q-10 12 -20 0 q-10 12 -20 0 q-10 12 -20 0 q-10 12 -20 0 q-10 12 -20 0 q-10 12 -12 0 z" fill="#fff4e6"/>
  <g fill="#e2572b">
    <circle cx="266" cy="290" r="4"/>
    <circle cx="300" cy="294" r="4"/>
    <circle cx="334" cy="290" r="4"/>
  </g>
  <rect x="294" y="220" width="12" height="32" rx="3" fill="#4a8fbf"/>
  <path d="M294 228 l12 -6 M294 238 l12 -6 M294 248 l12 -6" stroke="#ffffff" stroke-width="2"/>
  <path d="M300 196 q12 14 0 24 q-12 -10 0 -24 z" fill="#f2c14e"/>
  <path d="M300 206 q5 6 0 12 q-5 -6 0 -12 z" fill="#e2572b"/>
