    <rect x="420" y="270" width="108" height="46" rx="4" fill="none" stroke="#2e7d5b" stroke-width="2"/>
    <circle cx="500" cy="293" r="16" fill="#bfe0c8"/>
    <text x="444" y="304" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#2e7d5b" text-anchor="middle">150</text>
    <text x="500" y="302" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#2e7d5b" text-anchor="middle">€</text>
  </g>
