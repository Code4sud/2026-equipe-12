  <g transform="rotate(5 600 240)">
    <rect x="556" y="160" width="100" height="146" rx="4" fill="#ffffff"/>
    <rect x="556" y="160" width="100" height="16" rx="4" fill="#f2c14e"/>
    <g fill="none" stroke="#3b3f58" stroke-width="2.5">
      <rect x="568" y="190" width="14" height="14" rx="3"/>
      <rect x="568" y="218" width="14" height="14" rx="3"/>
      <rect x="568" y="246" width="14" height="14" rx="3"/>
      <rect x="568" y="274" width="14" height="14" rx="3"/>
    </g>
    <path d="M570 197 l4 5 l8 -10 M570 225 l4 5 l8 -10" fill="none" stroke="#2e7d5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#9aa0b4" stroke-width="4" stroke-linecap="round">
      <line x1="590" y1="197" x2="640" y2="197"/>
      <line x1="590" y1="225" x2="630" y2="225"/>
      <line x1="590" y1="253" x2="644" y2="253"/>
      <line x1="590" y1="281" x2="624" y2="281"/>
    </g>
  </g>
  <!-- Crayon -->
  <g transform="rotate(-25 640 312)">
    <rect x="590" y="306" width="86" height="12" rx="3" fill="#4a8fbf"/>
    <path d="M676 306 l16 6 l-16 6 z" fill="#f1e4d0"/>
    <path d="M686 310 l6 2 l-6 2 z" fill="#3b3f58"/>
  </g>
  <!-- Confettis -->
  <g>
    <rect x="220" y="160" width="10" height="5" rx="2" fill="#f2c14e" transform="rotate(30 225 162)"/>
    <rect x="400" y="190" width="10" height="5" rx="2" fill="#4a8fbf" transform="rotate(-20 405 192)"/>
    <rect x="510" y="150" width="10" height="5" rx="2" fill="#e2572b" transform="rotate(45 515 152)"/>
    <rect x="760" y="250" width="10" height="5" rx="2" fill="#f2c14e" transform="rotate(10 765 252)"/>
    <circle cx="40" cy="300" r="4" fill="#6fb38a"/>
    <circle cx="450" cy="140" r="4" fill="#6fb38a"/>
    <circle cx="760" cy="140" r="4" fill="#e2572b"/>
  </g>
