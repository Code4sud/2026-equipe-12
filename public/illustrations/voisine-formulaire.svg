<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="vf-titre vf-desc">
  <title id="vf-titre">Aider une voisine avec un formulaire en ligne</title>
  <desc id="vf-desc">Une personne âgée et un jeune sont assis devant un ordinateur portable qui affiche un formulaire en ligne. Un dossier papier est posé sur la table.</desc>
  <!-- Mur et sol -->
  <rect width="800" height="500" fill="#faf7f2"/>
  <rect width="800" height="400" fill="#e6efe4"/>
  <rect y="400" width="800" height="100" fill="#f1e4d0"/>
  <!-- Fenêtre -->
  <rect x="314" y="20" width="172" height="118" rx="8" fill="#ffffff"/>
  <rect x="324" y="30" width="152" height="98" rx="4" fill="#cfe6f0"/>
  <circle cx="446" cy="58" r="14" fill="#f2c14e"/>
  <path d="M324 128 l40 -40 l30 26 l24 -18 l58 32 z" fill="#8cc7a1"/>
  <rect x="397" y="30" width="6" height="98" fill="#ffffff"/>
  <rect x="324" y="76" width="152" height="6" fill="#ffffff"/>
  <!-- Cadre -->
  <rect x="40" y="46" width="96" height="74" rx="6" fill="#d79a62"/>
  <rect x="50" y="56" width="76" height="54" rx="3" fill="#fbe9dc"/>
  <circle cx="70" cy="74" r="8" fill="#e2572b"/>
  <path d="M50 110 l26 -24 l18 14 l14 -10 l18 20 z" fill="#6fb38a"/>
  <!-- Plante -->
  <path d="M724 420 h52 l-8 64 h-36 z" fill="#e2572b"/>
  <g fill="#6fb38a">
    <path d="M750 420 q-50 -40 -36 -110 q30 50 36 110 z"/>
    <path d="M750 420 q44 -50 26 -130 q-36 60 -26 130 z"/>
    <path d="M750 420 q-6 -70 10 -150 q16 80 -10 150 z"/>
  </g>
  <!-- Personne âgée (gauche) -->
  <rect x="96" y="210" width="150" height="140" rx="20" fill="#d79a62"/>
  <path d="M120 250 q0 -40 50 -40 h12 q50 0 50 40 v90 h-112 z" fill="#4a8fbf"/>
  <path d="M176 212 v130" stroke="#2f4a6b" stroke-width="3"/>
  <circle cx="168" cy="262" r="3" fill="#2f4a6b"/>
  <circle cx="168" cy="290" r="3" fill="#2f4a6b"/>
  <rect x="164" y="196" width="24" height="20" rx="6" fill="#f2c6a0"/>
  <circle cx="176" cy="170" r="36" fill="#f2c6a0"/>
  <g fill="#d5d8e0">
    <circle cx="150" cy="150" r="14"/>
    <circle cx="168" cy="138" r="15"/>
    <circle cx="190" cy="138" r="15"/>
    <circle cx="206" cy="152" r="13"/>
    <circle cx="144" cy="168" r="10"/>
  </g>
  <g fill="none" stroke="#3b3f58" stroke-width="3">
    <circle cx="180" cy="172" r="10"/>
    <circle cx="204" cy="172" r="10"/>
    <path d="M190 172 h4"/>
  </g>
  <circle cx="182" cy="172" r="3" fill="#3b3f58"/>
  <circle cx="206" cy="172" r="3" fill="#3b3f58"/>
  <path d="M184 190 q10 8 20 0" fill="none" stroke="#3b3f58" stroke-width="3" stroke-linecap="round"/>
  <circle cx="142" cy="176" r="7" fill="#f2c6a0"/>
  <!-- Jeune (droite) -->
  <rect x="556" y="210" width="150" height="140" rx="20" fill="#d79a62"/>
  <path d="M570 250 q0 -40 50 -40 h12 q50 0 50 40 v90 h-112 z" fill="#6fb38a"/>
  <path d="M600 214 q26 22 52 0" fill="none" stroke="#2e7d5b" stroke-width="8" stroke-linecap="round"/>
  <line x1="618" y1="226" x2="616" y2="250" stroke="#faf7f2" stroke-width="3" stroke-linecap="round"/>
  <line x1="634" y1="226" x2="636" y2="250" stroke="#faf7f2" stroke-width="3" stroke-linecap="round"/>
  <rect x="614" y="196" width="24" height="20" rx="6" fill="#c98d64"/>
  <circle cx="626" cy="170" r="36" fill="#c98d64"/>
  <path d="M590 170 q-4 -42 36 -42 q38 0 36 34 q-14 -18 -42 -14 q-20 4 -30 22 z" fill="#3b3f58"/>
  <circle cx="610" cy="174" r="3.5" fill="#3b3f58"/>
  <circle cx="632" cy="174" r="3.5" fill="#3b3f58"/>
  <path d="M606 190 q10 8 20 0" fill="none" stroke="#3b3f58" stroke-width="3" stroke-linecap="round"/>
  <circle cx="660" cy="178" r="7" fill="#c98d64"/>
  <!-- Bras du jeune qui montre l'écran -->
  <path d="M590 248 q-40 10 -70 20" fill="none" stroke="#6fb38a" stroke-width="22" stroke-linecap="round"/>
  <circle cx="514" cy="270" r="11" fill="#c98d64"/>
  <path d="M506 268 l-18 -6" stroke="#c98d64" stroke-width="7" stroke-linecap="round"/>
  <!-- Ordinateur portable : formulaire -->
  <rect x="290" y="150" width="220" height="152" rx="10" fill="#3b3f58"/>
  <rect x="300" y="160" width="200" height="132" rx="4" fill="#ffffff"/>
  <rect x="300" y="160" width="200" height="20" rx="4" fill="#4a8fbf"/>
  <circle cx="312" cy="170" r="4" fill="#ffffff"/>
  <g fill="#9aa0b4">
    <rect x="314" y="190" width="40" height="5" rx="2.5"/>
    <rect x="314" y="218" width="54" height="5" rx="2.5"/>
    <rect x="314" y="246" width="34" height="5" rx="2.5"/>
  </g>
  <g fill="#faf7f2" stroke="#9aa0b4" stroke-width="2">
    <rect x="314" y="199" width="172" height="13" rx="3"/>
    <rect x="314" y="227" width="172" height="13" rx="3"/>
    <rect x="314" y="255" width="13" height="13" rx="3"/>
  </g>
  <rect x="318" y="203" width="70" height="5" rx="2.5" fill="#3b3f58"/>
  <path d="M317 261 l3 4 l6 -8" fill="none" stroke="#2e7d5b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="334" y="259" width="70" height="5" rx="2.5" fill="#c9cdd8"/>
  <rect x="426" y="270" width="60" height="16" rx="8" fill="#e2572b"/>
  <path d="M450 278 h12 m-5 -5 l5 5 l-5 5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Table -->
  <path d="M60 316 h680 l30 64 h-740 z" fill="#d79a62"/>
  <rect x="30" y="380" width="740" height="18" rx="4" fill="#b97a45"/>
  <rect x="70" y="398" width="16" height="90" fill="#b97a45"/>
  <rect x="714" y="398" width="16" height="90" fill="#b97a45"/>
  <!-- Base du portable -->
  <path d="M276 302 h248 l12 18 h-272 z" fill="#9aa0b4"/>
  <rect x="370" y="306" width="60" height="6" rx="3" fill="#7c8299"/>
  <!-- Bras de la personne âgée sur la table -->
  <rect x="190" y="314" width="70" height="20" rx="10" fill="#4a8fbf"/>
  <circle cx="262" cy="324" r="10" fill="#f2c6a0"/>
  <!-- Dossier papier -->
  <path d="M100 348 l130 -6 l8 30 l-130 6 z" fill="#ffffff"/>
  <path d="M96 352 l140 -6 l6 32 l-140 6 z" fill="#f2c14e"/>
  <path d="M96 352 l48 -2 l4 -8 l30 -1 l2 9" fill="#e0ad38"/>
  <path d="M104 362 l120 -5" stroke="#d79a62" stroke-width="3"/>
  <path d="M188 348 l6 32" stroke="#e2572b" stroke-width="4"/>
  <!-- Tasse -->
  <rect x="580" y="330" width="34" height="36" rx="6" fill="#e2572b"/>
  <path d="M614 338 q14 0 14 12 q0 12 -14 12" fill="none" stroke="#e2572b" stroke-width="5"/>
  <path d="M590 322 q-6 -10 2 -18 M604 322 q-6 -10 2 -18" fill="none" stroke="#c9cdd8" stroke-width="3" stroke-linecap="round"/>
</svg>
