<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="tc-titre tc-desc">
  <title id="tc-titre">Téléphone cassé à l'arrêt de bus</title>
  <desc id="tc-desc">Un smartphone à l'écran fissuré est posé sur le banc d'un arrêt de bus. Une horloge indique qu'un rendez-vous approche.</desc>
  <!-- Ciel et sol -->
  <rect width="800" height="500" fill="#faf7f2"/>
  <rect width="800" height="350" fill="#dcecf2"/>
  <circle cx="700" cy="70" r="38" fill="#f2c14e"/>
  <g fill="#ffffff">
    <ellipse cx="420" cy="62" rx="54" ry="18"/>
    <ellipse cx="452" cy="50" rx="34" ry="20"/>
    <ellipse cx="120" cy="40" rx="40" ry="13"/>
  </g>
  <!-- Arbre au fond -->
  <rect x="694" y="220" width="16" height="130" rx="6" fill="#b97a45"/>
  <circle cx="702" cy="200" r="58" fill="#6fb38a"/>
  <circle cx="668" cy="226" r="34" fill="#5ea37b"/>
  <!-- Trottoir et route -->
  <rect y="340" width="800" height="100" fill="#f1e4d0"/>
  <rect y="336" width="800" height="8" fill="#e3d2b8"/>
  <rect y="440" width="800" height="60" fill="#8f94a8"/>
  <g fill="#faf7f2">
    <rect x="30" y="466" width="70" height="8" rx="4"/>
    <rect x="170" y="466" width="70" height="8" rx="4"/>
    <rect x="310" y="466" width="70" height="8" rx="4"/>
    <rect x="450" y="466" width="70" height="8" rx="4"/>
    <rect x="590" y="466" width="70" height="8" rx="4"/>
    <rect x="730" y="466" width="70" height="8" rx="4"/>
  </g>
  <!-- Horloge de rue -->
  <rect x="104" y="150" width="12" height="195" rx="5" fill="#3b3f58"/>
  <ellipse cx="110" cy="346" rx="26" ry="6" fill="#3b3f58" opacity="0.15"/>
  <circle cx="110" cy="120" r="50" fill="#3b3f58"/>
  <circle cx="110" cy="120" r="41" fill="#ffffff"/>
  <g stroke="#3b3f58" stroke-width="4" stroke-linecap="round">
    <line x1="110" y1="85" x2="110" y2="92"/>
    <line x1="145" y1="120" x2="138" y2="120"/>
    <line x1="110" y1="155" x2="110" y2="148"/>
    <line x1="75" y1="120" x2="82" y2="120"/>
  </g>
  <!-- 8 h 55 -->
  <line x1="110" y1="120" x2="86" y2="114" stroke="#3b3f58" stroke-width="6" stroke-linecap="round"/>
  <line x1="110" y1="120" x2="95" y2="91" stroke="#e2572b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="110" cy="120" r="5" fill="#3b3f58"/>
  <!-- Bulle rendez-vous (calendrier) -->
  <path d="M168 60 h74 a12 12 0 0 1 12 12 v48 a12 12 0 0 1 -12 12 h-48 l-18 16 l2 -16 h-10 a12 12 0 0 1 -12 -12 v-48 a12 12 0 0 1 12 -12 z" fill="#ffffff"/>
  <rect x="183" y="74" width="50" height="44" rx="6" fill="#e2572b"/>
  <rect x="183" y="88" width="50" height="30" rx="2" fill="#faf7f2"/>
  <rect x="192" y="68" width="6" height="12" rx="3" fill="#3b3f58"/>
  <rect x="218" y="68" width="6" height="12" rx="3" fill="#3b3f58"/>
  <g fill="#9aa0b4">
    <rect x="190" y="94" width="8" height="7" rx="1"/>
    <rect x="204" y="94" width="8" height="7" rx="1"/>
    <rect x="218" y="94" width="8" height="7" rx="1"/>
    <rect x="190" y="106" width="8" height="7" rx="1"/>
  </g>
  <rect x="204" y="106" width="8" height="7" rx="1" fill="#e2572b"/>
  <!-- Abribus -->
  <rect x="268" y="128" width="12" height="214" fill="#2f4a6b"/>
  <rect x="610" y="128" width="12" height="214" fill="#2f4a6b"/>
  <rect x="280" y="140" width="330" height="170" fill="#cfe6f0" opacity="0.75"/>
  <path d="M300 160 l40 -14 M560 290 l36 -14" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <rect x="254" y="110" width="382" height="26" rx="10" fill="#4a8fbf"/>
  <!-- Panneau bus -->
  <rect x="722" y="150" width="10" height="195" rx="4" fill="#3b3f58"/>
  <circle cx="727" cy="150" r="36" fill="#4a8fbf"/>
  <circle cx="727" cy="150" r="30" fill="none" stroke="#ffffff" stroke-width="3"/>
  <g fill="#ffffff">
    <rect x="708" y="134" width="38" height="28" rx="6"/>
    <circle cx="715" cy="166" r="4"/>
    <circle cx="739" cy="166" r="4"/>
  </g>
  <g fill="#4a8fbf">
    <rect x="712" y="139" width="13" height="9" rx="2"/>
    <rect x="729" y="139" width="13" height="9" rx="2"/>
  </g>
  <!-- Ombre du banc -->
  <ellipse cx="445" cy="346" rx="150" ry="10" fill="#3b3f58" opacity="0.12"/>
  <!-- Banc -->
  <rect x="320" y="290" width="12" height="54" rx="4" fill="#3b3f58"/>
  <rect x="558" y="290" width="12" height="54" rx="4" fill="#3b3f58"/>
  <rect x="306" y="226" width="278" height="20" rx="8" fill="#d0653a"/>
  <rect x="306" y="252" width="278" height="12" rx="6" fill="#d0653a"/>
  <rect x="296" y="280" width="298" height="18" rx="7" fill="#e2572b"/>
  <!-- Sac à dos posé -->
  <rect x="482" y="226" width="64" height="56" rx="16" fill="#6fb38a"/>
  <rect x="494" y="250" width="40" height="22" rx="7" fill="#5ea37b"/>
  <path d="M496 228 q18 -22 36 0" fill="none" stroke="#2e7d5b" stroke-width="6" stroke-linecap="round"/>
  <!-- Téléphone fissuré -->
  <g transform="rotate(-8 400 220)">
    <rect x="364" y="158" width="76" height="126" rx="12" fill="#3b3f58"/>
    <rect x="371" y="168" width="62" height="104" rx="6" fill="#2f4a6b"/>
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M402 210 l-14 -26 l-10 -8"/>
      <path d="M402 210 l22 -14 l8 -18"/>
      <path d="M402 210 l26 18 l4 22"/>
      <path d="M402 210 l-6 30 l-16 26"/>
      <path d="M402 210 l-26 6 l-6 10"/>
      <path d="M388 184 l12 -10"/>
      <path d="M424 196 l8 8"/>
    </g>
    <circle cx="402" cy="210" r="5" fill="#ffffff"/>
    <rect x="392" y="162" width="20" height="3" rx="1.5" fill="#9aa0b4"/>
  </g>
  <!-- Petites marques de choc -->
  <g stroke="#e2572b" stroke-width="4" stroke-linecap="round">
    <line x1="342" y1="168" x2="330" y2="156"/>
    <line x1="338" y1="196" x2="322" y2="196"/>
    <line x1="456" y1="150" x2="466" y2="136"/>
  </g>
</svg>
