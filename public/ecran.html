<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écran commun — Potentiel caché</title>
  <meta name="description" content="Écran commun de la partie, à afficher sur le PC ou le projecteur.">
  <meta name="theme-color" content="#e2572b">
  <link rel="stylesheet" href="jeu.css">
  <!-- QR code : qrcode-generator 1.4.4 (version exacte, cdnjs) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
          integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="js/ecran.js"></script>
</head>
<body class="ecran">
  <header class="ecran-entete">
    <span class="marque">Potentiel caché</span>
    <span id="progression" class="progression-problemes" aria-label=""></span>
    <span>Code : <span id="code-entete" class="code-partie">····</span></span>
  </header>

  <!-- La scène est entièrement reconstruite à partir de la vue envoyée par le serveur. -->
  <main id="scene" class="scene" tabindex="-1">
    <div class="pile centre">
      <h1>Connexion à la partie…</h1>
      <p class="points-attente" aria-hidden="true"><span></span><span></span><span></span></p>
    </div>
  </main>

  <!-- Annonce des changements de phase pour les lecteurs d'écran -->
  <p id="annonce" class="visuellement-cache" aria-live="polite" aria-atomic="true"></p>

  <!-- Commandes de l'animateur : discrètes mais accessibles au clavier -->
  <footer class="barre-animateur" aria-label="Commandes de l'animateur">
    <div class="commandes" id="commandes"></div>
    <div class="commandes">
      <span class="raccourcis discret" id="raccourcis" hidden><kbd>→</kbd> action principale</span>
      <button type="button" class="bouton discret" id="bouton-plein-ecran">Plein écran</button>
      <span class="statut-connexion" id="statut" data-etat="attente">Connexion…</span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
